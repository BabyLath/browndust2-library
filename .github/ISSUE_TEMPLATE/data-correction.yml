name: Data correction
description: A price, grade, tag, effect or date on the site is wrong.
labels: [data]
body:
  - type: input
    id: what
    attributes:
      label: What's wrong
      description: The unit, gear, tile or season, and the page it's on.
      placeholder: "Celia, The Curse costs 5 now, not 4"
    validations:
      required: true
  - type: input
    id: season
    attributes:
      label: Season you saw it in
      placeholder: Trial Season 3
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Screenshot or source
      description: Drag in a screenshot of the in-game shop or Codex, or link the official notice.
