# Runs the validator, link check and browser tests on pull requests, so problems show up
# before they're merged. (Pushes straight to main run the same checks in Deploy.)
name: Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run swg-check
      - run: uv run swg-build
      - run: uv run swg-linkcheck
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest
        env:
          SWG_TEST_NO_BUILD: "1"
