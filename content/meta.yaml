# Fixed vocabularies. swg-check rejects anything not listed here,
# so a typo like "Curese" fails the build instead of showing up on the site.

# The seven grades from the in-game Codex filter, lowest first. Their badge colours are set
# in lib/styles/extra.css (search for "grade badges").
grades:
  - Basic
  - Rare
  - Ancient
  - Heroic
  - Legendary
  - Mythical
  - Unique

# The eight unit tags from the in-game Codex.
# Icon: lib/images/tags/<tag in lower case, dashes for spaces>.png, e.g. close-range-attack.png
# In units.yaml a tag can be written as its name or its id: "Close-Range Attack" or close-range-attack.
tags:
  - Close-Range Attack
  - Long-Range Attack
  - Defending
  - Support
  - Heal
  - Curse
  - Cleanse
  - Remove

# Other names accepted in units.yaml, mapped to the tag the site shows.
# The Codex filter calls it Support; gear text calls the same characters "Utility".
tag_aliases:
  utility: Support

# Roles used on unit guide pages (front matter `role:`).
roles:
  - attacker
  - support
  - debuffer
  - healer
  - defender
  - utility

# Tiers for a unit guide's damage and support ranks (front matter `ranks:`). Best first.
ratings: [S, A, B, C, D, F]
