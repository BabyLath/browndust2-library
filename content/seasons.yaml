# Soul Wager seasons, oldest first. The last entry is treated as the current season.
#
#   start:  the day the season opened (after maintenance), YYYY-MM-DD
#   end:    the last day of the season. Runs lock for settlement at 15:00 UTC that day.
#           Leave it out while the official date is unknown.
#   expected_end: a best guess, shown as "about" on the site. Seasons have run 8 weeks.
#   boards: boards in this season. Add them as you confirm them.
#   changes: one line per notable change, shown on the Seasons page.
#   sources: links backing the changes.

seasons:
  - id: s1
    name: Trial Season 1
    start: 2026-07-15
    end: 2026-08-25
    boards:
      - { number: 5, name: Tainted Hunting Grounds, phases: 15 }
    changes:
      - The Soul Wager launches. Unlocks after clearing every Edge of Dimension main quest.
    sources:
      - https://dotgg.gg/brown-dust-2/%F0%9F%8E%B2-the-soul-wager-challenge-event-%F0%9F%8E%B2/

  - id: s2
    name: Trial Season 2
    start: 2026-08-26
    end: 2026-10-20
    boards: []
    changes:
      - Cost and stat changes to a number of unit pieces (values published as images in the official notice).
    sources:
      - https://dotgg.gg/brown-dust-2/%F0%9F%93%A2-the-soul-wager-trial-season-2-unit-piece-balance-changes/

  - id: s3
    name: Trial Season 3
    start: 2026-10-21
    expected_end: 2026-12-15
    boards: []
    changes:
      - New Unique-grade pieces added.
      - Cost and stat changes to some existing pieces.
      - "Celia, The Curse: fixed her playing Masquerade Bunny's voice lines."
      - "Justia, Blood Glutton: her ★ condition now only counts units that act on a cooldown."
      - "Dalvi, Summer Vacation: Laceration now applies only when an attack hits, not on every cooldown action."
    sources:
      - https://dotgg.gg/brown-dust-2/%F0%9F%93%A2-the-soul-wager-trial-season-3-unit-piece-balance-changes/
      - https://dotgg.gg/brown-dust-2/%F0%9F%93%8B54th-developer-notes-october-update/
