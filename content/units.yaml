# Unit pieces sold in the Battle Shop. Keep each id lowercase-with-dashes; builds and guides refer to it.
#
#   - id: celia-the-curse
#     character: Celia
#     costume: The Curse
#     price: 4
#     grade: Rare
#     tags: [Curse]
#     shape: "##/##"
#     upgrades: [2, 3, 4, 5, 6]
#
#   price:    shop cost in Soul Tokens
#   grade:    one of the grades in content/meta.yaml, or "" if unknown
#   tags:     any of the tags in content/meta.yaml, like [Curse, Support]
#   shape:    the unit's footprint from the Codex. Rows split by "/", # is a filled square,
#             . is an empty one: "#" is 1x1, "##/##" is 2x2, ".#./###/###/.#." is the 3x4
#             footprint with the corners missing (8 squares). The Shape column appears once any unit has one.
#   upgrades: the cost of each upgrade, +1 through +5, in that order. Exactly five whole numbers,
#             or [] until you know them. The +1 to +5 columns appear once any unit has them.
#
# A unit's effect goes on its own page, lib/units/<id>.md, under "## Effect".
# Run "uv run swg-new-unit <id>" to create that page from the template.

# Bump verified_for when you've checked every price against the current season.
# swg-check warns when this is behind the current season in seasons.yaml.

verified_for: s3
