# Alea Chip rewards and the Alea Chip shop. Shown on the "Alea Chip shop" page (lib/guide/rewards.md).
#
# Leave a number blank (or write ?) until you've checked it in game. The page shows "?" for it
# and swg-check lists what's still missing. Totals are worked out for you.
#
#   clears:  Alea Chips for clearing each Board, one line per Board.
#     board: the Board's name or number, as the game shows it
#     chips: Alea Chips for clearing it
#
#   shop:    what the Alea Chip shop sells this season.
#     item:  name as the shop shows it
#     price: Alea Chips for one
#     limit: how many you can buy this season, or unlimited
#     note:  optional, one short line

clears:
  - { board: "Board 1: Traitor's Stronghold", chips: 1000}
  - { board: "Board 2: Fractured Earth", chips: 1000}
  - { board: "Board 3: Desolate Ruins", chips: 1000}
  - { board: "Board 4: Dark Magic Lair", chips: 1000}
  - { board: "Board 5: Dak Magic Lair 2", chips: 1000}

shop:
  - { item: Refining Powder, price: 100, limit: 10, note: "Prioitize these." }
  - { item: Tear of Goddess, price: 1000, limit: 1, note: "Prioitize these." }
  - { item: Gold, price: 100, limit: 10, note: "Prioitize these." }
  - { item: "★4 Recruit Contract", price: 500, limit: 2}
  - { item: "★5 Recruit Contract", price: 1000, limit: 1}
  - { item: Fire Magic Crystal, price: 100, limit: 10}
  - { item: Water Magic Crystal, price: 100, limit: 10}
  - { item: Wind Magic Crystal, price: 100, limit: 10}
  - { item: Light Magic Crystal, price: 100, limit: 10}
  - { item: Dark Magic Crystal, price: 100, limit: 10}
  
  
  
