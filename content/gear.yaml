# Gear sold in the Battle Shop.
#
# Each piece is written in block style so its effect can span several lines:
#
#   - id: knights-sword
#     name: "Knight's Sword"
#     price: 6
#     effect: |
#       Equip on an Attacking Character.
#       Close-range: +2 DMG.
#
#       - Stacks with [[Strength]].
#
# Under "effect: |", indent every line by the same amount (6 spaces here). Each line shows as
# its own line, a blank line starts a new paragraph, and "- " lines become a bullet list.
# Leave it empty until you know the effect; the Effect column appears once any piece has one.
#
# Icon: put a picture at lib/images/gear/<id>.png (or .webp, .svg, .jpg) and it appears
#   beside the name. Add "image: other-name.png" under a piece to use a different file name.

verified_for: s2
source: BD2 Tactical Compendium price table (page dated 2026-10-22)

